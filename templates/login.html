{% extends "layout.html" %}

{% block title %}
    Đăng nhập
{% endblock %}

{% block main %}
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h3 class="mb-4 text-primary">Hệ thống ASM Tracker</h3>
                        <form action="/login" method="post">
                            <div class="mb-3">
                                <input autocomplete="off" autofocus class="form-control mx-auto" name="username" placeholder="Tên đăng nhập" type="text" required>
                            </div>
                            <div class="mb-3">
                                <input class="form-control mx-auto" name="password" placeholder="Mật khẩu" type="password" required>
                            </div>
                            <button class="btn btn-primary w-100" type="submit">Đăng nhập ngay</button>
                        </form>
                        <hr>
                        <p class="small text-muted">Chưa có tài khoản? <a href="/register">Đăng ký tại đây</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
