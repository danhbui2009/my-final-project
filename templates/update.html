{% extends "layout.html" %}

{% block title %} Cập nhật doanh số {% endblock %}

{% block main %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0">Báo cáo đơn hàng mới</h4>
                </div>
                <div class="card-body">
                    <form action="/update" method="post">
                        <div class="mb-3 text-start">
                            <label class="form-label fw-bold">Số tiền doanh số (VNĐ)</label>
                            <input class="form-control" name="amount" type="number" step="0.01" placeholder="Ví dụ: 1000000" required>
                        </div>
                        <div class="mb-3 text-start">
                            <label class="form-label fw-bold">Tên khách hàng</label>
                            <input class="form-control" name="customer_name" type="text" placeholder="Nhập tên khách hàng hoặc mã hợp đồng">
                        </div>
                        <div class="mb-3 text-start">
                            <label class="form-label fw-bold">Ghi chú</label>
                            <textarea class="form-control" name="note" rows="3" placeholder="Chi tiết đơn hàng..."></textarea>
                        </div>
                        <div class="d-grid">
                            <button class="btn btn-success btn-lg" type="submit">Gửi báo cáo</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
